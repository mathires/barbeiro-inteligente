name: Manter o Supabase ativo

# O plano gratuito do Supabase pausa o projeto apos ~1 semana sem uso.
# Este aviso diario (de leitura, sem dados) evita a pausa se a barbearia ficar fechada.
# Para ativar: Settings > Secrets and variables > Actions, crie
#   - Variable  SUPABASE_URL              (ex.: https://xxxx.supabase.co)
#   - Secret    SUPABASE_PUBLISHABLE_KEY  (a chave publica sb_publishable_...)
on:
  schedule:
    - cron: '17 9 */3 * *'   # a cada 3 dias, 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: ${{ vars.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Consulta simples ao banco
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY nao configurados. Nada a fazer."
            exit 0
          fi
          curl -fsS "$URL/rest/v1/barbearias?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
